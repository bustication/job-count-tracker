name: Terraform checks

# This repo has no push-triggered CI at all otherwise (update-data.yml is
# schedule/workflow_dispatch only) -- added so infra/terraform changes get
# the same fmt/TFLint/Trivy coverage the sibling scraper repos' own
# dry-run-gate jobs run on every push. Path-filtered so the daily bot commit
# to data/history.csv (see update-data.yml) never triggers this.
on:
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  pull_request:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch: {}

# None of these checks need AWS credentials -- fmt/TFLint/Trivy are all
# static analysis against the HCL source.
permissions:
  contents: read

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform validate (no backend, no AWS creds)
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5

      - name: TFLint
        working-directory: infra/terraform
        run: tflint

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
